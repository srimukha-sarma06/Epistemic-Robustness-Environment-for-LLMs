[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-robustness-env"
version = "2.1.0"
description = "OpenEnv RL environment for sycophancy resistance, hallucination and overclaiming"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "openai>=1.0",
    "docker>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
# GRPO training (python -m training.train_grpo)
train = [
    "torch>=2.4",
    "transformers>=4.56",
    "trl>=1.0",
    "peft>=0.13",
    "datasets>=2.20",
    "accelerate>=1.0",
]

[project.scripts]
# Server entry point: `uv run server` (or `python -m server.app`)
server = "server.app:main"

[tool.setuptools]
packages = ["server", "training"]
py-modules = ["inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
